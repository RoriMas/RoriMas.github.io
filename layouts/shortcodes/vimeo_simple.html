{{- $id := .Get 0 -}}
{{- $title := .Get "title" | default "Video Vimeo" -}}
<div class="vimeo-embed">
  <iframe
    src="https://player.vimeo.com/video/{{ $id }}?dnt=1"
    title="{{ $title }}"
    loading="lazy"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>
